<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FRAMLab</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="FRAMLab.styles.css" rel="stylesheet" />
    <link rel="apple-touch-icon" sizes="512x512" href="FRAM_512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="FRAM_192.png" />
    <link href="favicon.ico" rel="icon" type="image/x-icon" />
    <link rel="SHORTCUT ICON" href="FRAM_512.png" />
</head>

<body>
    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script type="text/javascript">
        window.getDimensions = function () {
            return {
                width: window.innerWidth,
                height: window.innerHeight
            };
        };
        // Scroll the canvas so a point (canvas pixels) is centred, e.g. a function picked from the list
        window.scrollCanvasTo = function (x, y) {
            const host = document.getElementById('canvas_1')?.parentElement;
            if (!host) return;
            const smooth = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            host.scrollTo({ left: Math.max(0, x - host.clientWidth / 2), top: Math.max(0, y - host.clientHeight / 2), behavior: smooth ? 'smooth' : 'auto' });
        };
        // Visible size of the area that holds the model canvas (excludes side panels and toolbar)
        window.getCanvasViewport = function () {
            const host = document.getElementById('canvas_1')?.parentElement;
            return host ? { width: host.clientWidth, height: host.clientHeight } : null;
        };
    </script>
    <script src="SaveFile.js"></script>
    <script src="OpenFile.js"></script>
    <script type="text/javascript">
        function focusInput(id) {
            document.getElementById(id)?.focus(); // the element may not be rendered yet
        }
    </script>
    <script type="text/javascript">
        function clearInput(id) {
            const el = document.getElementById(id);
            if (el) el.value = '';
        }
    </script>
    <script type="text/javascript">
        function setInput(id, text) {
            const el = document.getElementById(id);
            if (el) el.value = text;
        }
    </script>
    <script type="text/javascript">
        function getHTML(id) {
            return document.getElementById(id).outerHTML;
        }
    </script>
    <script type="text/javascript">
        function getFocusElement() {
            return document.activeElement.id;
        }
    </script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="svgUtils.js"></script>
    <script src="scriptEditor.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
